# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Audiobooks rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
# Edit a value to change the project-wide default. Comment a line out to fall
# back to the code default. Library-specific overrides belong in
# `rules/audiobooks.local.yaml`, which is gitignored.
#
# Full reference: docs/CONFIG.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Chapter file patterns ───────────────────────────────────────────────────
# Scanner tries multi_disc first, then falls back to single_disc.
patterns:
  single_disc: '^(?<chapter>\d{2})\s-\s(?<name>.+)$'             # 01 - Chapter Name
  multi_disc:  '^(?<disc>\d+)(?<chapter>\d{2})\s-\s(?<name>.+)$' # 101 - Chapter Name (disc 1, chapter 1)

# ── Subfolders under root_path to walk ──────────────────────────────────────
# Empty (the default) = scan root_path directly and label everything as
# "default". Configure for your library in audiobooks.local.yaml.
#
# Common use cases:
#
#   # A. Organized by source / format:
#   categories:
#     - { name: Audible }
#     - { name: Book On CD }
#
#   # B. Flat library (no subfolders):
#   categories: []
#
# Note: audiobooks don't use quality-organized categories — spoken word at
# modest bitrates is fine, so no quality dimension check applies.
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
# Primary = formats you prefer (others fire warn_non_primary).
primary_extension:
  - .mp3
  - .flac

# Audio = every extension recognized as an audiobook chapter.
audio_extensions:
  - .m4b
  - .mp3
  - .aac
  - .m4a
  - .flac

# Sidecar = silently allowed alongside chapters (cover art, cuesheets, PDFs).
sidecar_extensions:
  - .nfo
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .cue
  - .pdf

# ── Per-warning toggles ─────────────────────────────────────────────────────
# Set any to false to silence that warning everywhere. To silence on specific
# paths only, use ignored/audiobooks.yaml instead.
checks:
  warn_non_primary: true        # File isn't the configured primary format
  warn_no_audio: true           # Book folder has no audio files
  warn_bad_chapter_name: true   # Chapter file name doesn't match any pattern
  warn_chapter_gaps: true       # Gap detected in chapter numbers (per-disc)
  warn_duplicate_book: true     # Same book title in more than one media folder
  warn_loose_files: true        # Audio files at unexpected nesting
  warn_extra_subfolders: true   # Unexpected subfolders inside a book folder
  warn_unexpected_entries: true # Non-audio, non-sidecar files
