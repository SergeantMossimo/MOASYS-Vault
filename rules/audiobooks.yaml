# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Audiobooks rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
#
# This file is a snapshot of the code-shipped defaults. Edit a value to
# change the project-wide default. Comment a line out to fall back to the
# current code default.
#
# Personal overrides belong in `rules/audiobooks.local.yaml` — gitignored.
#
# Loader behavior:  code defaults  →  this file  →  audiobooks.local.yaml  →  Zod
# ─────────────────────────────────────────────────────────────────────────────

# ── Regex patterns ──────────────────────────────────────────────────────────
# Chapter files: scanner tries multi_disc first, then single_disc.
patterns:
  single_disc: '^(?<chapter>\d{2})\s-\s(?<name>.+)$'
  multi_disc:  '^(?<disc>\d+)(?<chapter>\d{2})\s-\s(?<name>.+)$'

# ── Categories ──────────────────────────────────────────────────────────────
# Subfolders under root_path to walk. Each category's `name` is both the
# folder name on disk AND the label used in output JSON. Empty (the default)
# means: walk root_path directly and label records as "default".
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
primary_extension:
  - .mp3
  - .flac

audio_extensions:
  - .m4b
  - .mp3
  - .aac
  - .m4a
  - .flac

# ── Sidecar files ───────────────────────────────────────────────────────────
sidecar_extensions:
  - .nfo
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .cue
  - .pdf

# ── Per-warning toggles ─────────────────────────────────────────────────────
checks:
  warn_non_primary: true        # File isn't the configured primary format
  warn_no_audio: true           # Book folder has no audio files
  warn_bad_chapter_name: true   # Chapter file name doesn't match any pattern
  warn_chapter_gaps: true       # Gap detected in chapter numbers (per-disc)
  warn_duplicate_book: true     # Same book title in more than one media folder
  warn_loose_files: true        # Audio files at unexpected nesting
  warn_extra_subfolders: true   # Unexpected subfolders inside a book folder
  warn_unexpected_entries: true # Non-audio, non-sidecar files
