# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Movies rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
#
# This file is a snapshot of the code-shipped defaults — every option visible
# and active. Edit a value to change the project-wide default. Comment a line
# out to fall back to whatever the current code default is (useful when you
# want to "ignore" a particular setting and let the code decide).
#
# Personal, library-specific overrides (extra categories, custom quality
# thresholds, etc.) belong in `rules/movies.local.yaml` — that file is
# gitignored so it never gets committed.
#
# Loader behavior:  code defaults  →  this file  →  movies.local.yaml  →  Zod
# ─────────────────────────────────────────────────────────────────────────────

# ── Regex patterns ──────────────────────────────────────────────────────────
# Patterns MUST use named capture groups. They can be plain strings (no flags)
# or { pattern, flags } objects.
patterns:
  folder: '^(?<title>.+)\s\((?<year>\d{4})\)$'                                     # The Crow (1994)
  file:   '^(?<title>.+)\s\((?<year>\d{4})\)(?:\s\{edition-(?<edition>[^}]*)\})?$' # The Crow (1994) {edition-Director's Cut}

# ── Categories ──────────────────────────────────────────────────────────────
# Subfolders under root_path to walk. Each category's `name` is both the
# folder name on disk AND the label used in output JSON (the `category` field
# on each version). Empty (the default) means: walk root_path directly and
# label records as "default". For a library with quality buckets, put your
# folder names here (or in your movies.local.yaml).
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
# Primary = the formats you expect; anything else triggers warn_non_primary.
# Video = every extension treated as a movie file; outside this list = "unexpected".
primary_extension:
  - .mp4

video_extensions:
  - .mp4
  - .mkv
  - .avi
  - .m4v
  - .mov
  - .wmv
  - .ts
  - .m2ts
  - .webm

# ── Acceptable year range ───────────────────────────────────────────────────
# Files with a year outside this range get warn_suspicious_year.
# `max: current` resolves to the current calendar year at boot.
year_range:
  min: 1888
  max: current

# ── Cross-folder quality combinations ───────────────────────────────────────
# Cases where the same movie intentionally lives in two quality folders
# (e.g. UHD master + HD downscale). Set-based comparison.
acceptable_quality_combos:
  - [UHD, HD]

# ── Sidecar files ───────────────────────────────────────────────────────────
# Extensions silently allowed anywhere in the movie hierarchy. Anything else
# (non-video, non-sidecar) triggers warn_unexpected_entries.
sidecar_extensions:
  - .nfo
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .tbn
  - .srt
  - .ass
  - .ssa
  - .vtt
  - .sub
  - .idx

# ── Quality buckets (ffprobe pass) ──────────────────────────────────────────
# Each bucket's `name` must match a category name to take effect. A file in
# a category whose name appears here is checked: its long edge (max of width
# and height) must fall in [min_width, max_width]. Either bound is optional.
# Categories whose name doesn't appear here (e.g. "Other UHD") are silently
# passed — the warning is opt-in by bucket configuration.
# Empty default = silent. Configure for your library in movies.local.yaml.
quality_thresholds: []

# ── Per-warning toggles ─────────────────────────────────────────────────────
# All warnings ship enabled. Set any to `false` to silence it.
checks:
  warn_non_primary: true          # File isn't the configured primary format
  warn_no_videos: true            # Movie folder has no video files
  warn_bad_file_name: true        # File name doesn't match patterns.file
  warn_bad_folder_name: true      # Folder name doesn't match patterns.folder
  warn_empty_edition: true        # {edition-} with no value
  warn_suspicious_year: true      # Year outside year_range
  warn_title_mismatch: true       # File title vs folder title
  warn_year_mismatch: true        # File year vs folder year
  warn_duplicate_edition: true    # Two files in same folder claim same edition
  warn_multi_quality: true        # Movie in multiple quality folders (unless in acceptable_quality_combos)
  warn_quality_mismatch: true     # ffprobe dimensions don't fit quality_thresholds bucket
  warn_loose_files: true          # Video files at unexpected nesting
  warn_extra_subfolders: true     # Unexpected subfolders inside a movie folder
  warn_unexpected_entries: true   # Non-video, non-sidecar files
  warn_tmdb_no_match: true        # TMDB found no plausible match
  warn_tmdb_low_confidence: true  # TMDB match score below threshold
  warn_tmdb_year_mismatch: true   # TMDB canonical year differs from folder year
  warn_tmdb_title_canonical: true # Folder title differs from TMDB filename-safe canonical
