# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Music rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
#
# This file is a snapshot of the code-shipped defaults. Edit a value to
# change the project-wide default. Comment a line out to fall back to the
# current code default.
#
# Personal overrides belong in `rules/music.local.yaml` — gitignored.
#
# Loader behavior:  code defaults  →  this file  →  music.local.yaml  →  Zod
# ─────────────────────────────────────────────────────────────────────────────

# ── Regex patterns ──────────────────────────────────────────────────────────
# Plex doesn't specify a format for artist or album folders — the defaults
# match anything non-empty. Tighten them in music.local.yaml if you use a
# stricter library convention.
patterns:
  artist_folder: '^(?<name>.+)$'                                # Permissive default
  album_folder:  '^(?<name>.+)$'                                # Permissive default
  single_disc:   '^(?<track>\d{2})\s-\s(?<name>.+)$'           # 01 - Track Name
  multi_disc:    '^(?<disc>\d+)(?<track>\d{2})\s-\s(?<name>.+)$' # 101 - Track Name (multi-disc)

# ── Categories ──────────────────────────────────────────────────────────────
# Subfolders under root_path to walk. Each category's `name` is both the
# folder name on disk AND the label used in output JSON. Empty (the default)
# means: walk root_path directly and label records as "default".
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
primary_extension:
  - .flac
  - .mp3
  - .m4a

audio_extensions:
  - .flac
  - .mp3
  - .aac
  - .m4a
  - .wav
  - .ogg
  - .wma

# ── Sidecar files ───────────────────────────────────────────────────────────
sidecar_extensions:
  - .nfo
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .lrc
  - .cue
  - .m3u
  - .m3u8
  - .pdf

# ── Per-warning toggles ─────────────────────────────────────────────────────
checks:
  warn_non_primary: true              # File isn't the configured primary format
  warn_no_audio: true                 # Album folder has no audio files
  warn_bad_track_name: true           # Track file name doesn't match any pattern
  warn_bad_artist_folder: true        # Artist folder doesn't match patterns.artist_folder
  warn_bad_album_folder: true         # Album folder doesn't match patterns.album_folder
  warn_suspicious_folder_chars: true  # Trailing whitespace / Windows-illegal / reserved names
  warn_track_gaps: true               # Gap detected in track numbers (per-disc)
  warn_duplicate_album: true          # Same artist + album in more than one media folder
  warn_loose_files: true              # Audio files at unexpected nesting
  warn_extra_subfolders: true         # Unexpected subfolders inside an album folder
  warn_unexpected_entries: true       # Non-audio, non-sidecar files
  warn_quality_inconsistent: true     # Album mixes codecs / wide bitrate spread (probe)
  warn_compilation_detected: true     # Multiple distinct AlbumArtists in one album (probe + ID3)
  warn_folder_tag_mismatch: true      # Folder name disagrees with embedded tag (probe + ID3)
  warn_missing_tags: true             # Required ID3 fields blank (probe + ID3)
  warn_track_number_mismatch: true    # Filename track number ≠ tag's TrackNumber (probe + ID3)
