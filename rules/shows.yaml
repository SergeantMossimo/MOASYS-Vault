# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Shows rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
# Edit a value to change the project-wide default. Comment a line out to fall
# back to the code default. Library-specific overrides belong in
# `rules/shows.local.yaml`, which is gitignored.
#
# Full reference: docs/CONFIG.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Folder + file name patterns ─────────────────────────────────────────────
# Plex's TV naming convention. Patterns use named capture groups.
patterns:
  show_folder: '^(?<title>.+)\s\((?<year>\d{4})\)$'                                # Star Trek Enterprise (2001)
  season_folder:
    pattern: '^Season\s(?<season>\d{2})$'                                          # Season 01 (case-insensitive)
    flags: 'i'
  file:
    pattern: '^(?<title>.+)\s\((?<year>\d{4})\)\s-\sS(?<season>\d{2})E(?<episode>\d{2})(?:-E?(?<episode_end>\d{2}))?(?:\s-\s.+)?$'
    flags: 'i'

# ── Subfolders under root_path to walk ──────────────────────────────────────
# Empty (the default) = scan root_path directly and label everything as
# "default". Configure for your library in shows.local.yaml.
#
# Common use cases:
#
#   # A. Organized by quality (UHD/HD/SD auto-detected):
#   categories:
#     - { name: UHD }
#     - { name: HD }
#     - { name: SD }
#
#   # B. Organized by general tags (no quality concept):
#   categories:
#     - { name: Shows }
#     - { name: Anime }
#     - { name: Documentaries }
#
#   # C. Flat library (no subfolders):
#   categories: []
#
# See docs/CONFIG.md "Three configuration shapes" for the full explanation.
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
# Primary = formats you prefer (others fire warn_non_primary).
primary_extension:
  - .mp4

# Video = every extension recognized as an episode file.
video_extensions:
  - .mp4
  - .mkv
  - .avi
  - .m4v
  - .mov
  - .wmv
  - .ts
  - .m2ts

# Special-season folder names that bypass the `Season XX` regex.
# Plex's universal convention is `Specials`.
ignored_season_names:
  - Specials

# Sidecar = silently allowed alongside episodes (poster art, subtitles, NFOs).
sidecar_extensions:
#   - .nfo
  - .jpg
  - .srt

# ── Quality buckets ─────────────────────────────────────────────────────────
# Only used when categories are organized by quality (shape A above).
# Defines what UHD / HD / SD mean dimensionally. Empty default = no
# dimension checks fire. Configure in shows.local.yaml.
quality_thresholds: []

# ── Acceptable per-season multi-quality combos ──────────────────────────────
# Only used when categories are organized by quality (shape A above).
# Lists quality sets a single season may legitimately span without firing
# warn_multi_quality. Scope is per-season — keeping S01 in HD and S02 in UHD
# never fires; only S01 existing in BOTH UHD and HD does.
acceptable_quality_combos:
  - [UHD, HD]

# ── Per-warning toggles ─────────────────────────────────────────────────────
# Set any to false to silence that warning everywhere. To silence on specific
# paths only, use ignored/shows.yaml instead.
checks:
  warn_non_primary: true          # File isn't the configured primary format
  warn_no_videos: true            # Season folder has no video files
  warn_bad_show_folder: true      # Show folder doesn't match patterns.show_folder
  warn_bad_season_folder: true    # Season folder doesn't match (and isn't in ignored_season_names)
  warn_bad_file_name: true        # File doesn't match patterns.file
  warn_show_year_mismatch: true   # File's show/year vs parent show folder
  warn_season_mismatch: true      # File's season number vs parent season folder
  warn_episode_gaps: true         # Gap detected in episode numbers
  warn_quality_mismatch: true     # File dimensions don't fit its category's quality bucket
  warn_multi_quality: true        # A single season exists in multiple distinct qualities
  warn_loose_files: true          # Video files at unexpected nesting
  warn_extra_subfolders: true     # Unexpected subfolders inside a season folder
  warn_unexpected_entries: true   # Non-video, non-sidecar files
  warn_tmdb_no_match: true        # TMDB found no plausible match
  warn_tmdb_low_confidence: true  # TMDB match score below threshold
  warn_tmdb_episode_count: true   # Local season has fewer episodes than TMDB lists
  warn_tmdb_title_canonical: true # Folder title differs from TMDB filename-safe canonical
