# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Shows rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
#
# This file is a snapshot of the code-shipped defaults. Edit a value to
# change the project-wide default. Comment a line out to fall back to the
# current code default.
#
# Personal overrides (extra ignored_season_names, custom quality_thresholds,
# categories) belong in `rules/shows.local.yaml` — gitignored.
#
# Loader behavior:  code defaults  →  this file  →  shows.local.yaml  →  Zod
# ─────────────────────────────────────────────────────────────────────────────

# ── Regex patterns ──────────────────────────────────────────────────────────
patterns:
  show_folder: '^(?<title>.+)\s\((?<year>\d{4})\)$'                                # Star Trek Enterprise (2001)
  season_folder:
    pattern: '^Season\s(?<season>\d{2})$'                                          # Season 01 (case-insensitive)
    flags: 'i'
  file:
    pattern: '^(?<title>.+)\s\((?<year>\d{4})\)\s-\sS(?<season>\d{2})E(?<episode>\d{2})(?:-E?(?<episode_end>\d{2}))?(?:\s-\s.+)?$'
    flags: 'i'

# ── Categories ──────────────────────────────────────────────────────────────
# Subfolders under root_path to walk. Each category's `name` is both the
# folder name on disk AND the label used in output JSON. Empty (the default)
# means: walk root_path directly and label records as "default".
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
primary_extension:
  - .mp4

video_extensions:
  - .mp4
  - .mkv
  - .avi
  - .m4v
  - .mov
  - .wmv
  - .ts
  - .m2ts

# ── Special-season folder names ─────────────────────────────────────────────
# Season folder names that bypass the Season XX regex check. Plex's universal
# convention is `Specials`.
ignored_season_names:
  - Specials

# ── Sidecar files ───────────────────────────────────────────────────────────
sidecar_extensions:
  - .nfo
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .tbn
  - .srt
  - .ass
  - .ssa
  - .vtt
  - .sub
  - .idx

# ── Quality buckets (ffprobe pass) ──────────────────────────────────────────
# Empty default = silent. Configure for your library in shows.local.yaml.
quality_thresholds: []

# ── Per-warning toggles ─────────────────────────────────────────────────────
checks:
  warn_non_primary: true          # File isn't the configured primary format
  warn_no_videos: true            # Season folder has no video files
  warn_bad_show_folder: true      # Show folder doesn't match patterns.show_folder
  warn_bad_season_folder: true    # Season folder doesn't match (and isn't in ignored_season_names)
  warn_bad_file_name: true        # File doesn't match patterns.file
  warn_show_year_mismatch: true   # File's show/year vs parent show folder
  warn_season_mismatch: true      # File's season number vs parent season folder
  warn_episode_gaps: true         # Gap detected in episode numbers
  warn_quality_mismatch: true     # ffprobe dimensions don't fit quality_thresholds bucket
  warn_loose_files: true          # Video files at unexpected nesting
  warn_extra_subfolders: true     # Unexpected subfolders inside a season folder
  warn_unexpected_entries: true   # Non-video, non-sidecar files
  warn_tmdb_no_match: true        # TMDB found no plausible match
  warn_tmdb_low_confidence: true  # TMDB match score below threshold
  warn_tmdb_episode_count: true   # Local season has fewer episodes than TMDB lists
  warn_tmdb_title_canonical: true # Folder title differs from TMDB filename-safe canonical
